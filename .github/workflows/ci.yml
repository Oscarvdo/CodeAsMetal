# Core checks run without GUI dependencies. Full Windows validation is an
# explicit workflow_dispatch because CAD/Qt builds are expensive and need a
# reviewed dependency commit. No claim is made that this workflow has run.
name: CodeAsMetal
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      vcpkg_ref:
        description: 'Reviewed vcpkg commit/tag with OCCT 7.x'
        required: true
        type: string
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset core-only
      - run: cmake --build --preset core-only
      - run: ctest --preset core-only
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install reviewed dependencies
        shell: pwsh
        env:
          CAM_VCPKG_REF: ${{ inputs.vcpkg_ref }}
        run: |
          ./scripts/prepare-dependencies.ps1 -VcpkgRef $env:CAM_VCPKG_REF -Destination "$env:RUNNER_TEMP/vcpkg-cam"
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg-cam" >> $env:GITHUB_ENV
      - run: cmake --preset windows-release
      - run: cmake --build --preset windows-release --parallel 4
      - run: ctest --preset windows-release
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lock-and-test-results
          path: |
            dependencies.lock.json
            out/build/windows-release/Testing/Temporary/LastTest.log
